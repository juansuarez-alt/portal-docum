name: Satisfacción · Multimarca

on:
  schedule:
    # Cada 4 horas. Recalcula los últimos 10 días porque las encuestas
    # llegan horas o días después de que se resuelve el ticket.
    - cron: "40 */4 * * *"
  workflow_dispatch:
    inputs:
      marca:
        description: "Marca sin tildes, como está en Zendesk (vacío = todas). Ej: BALU, DOCUM, FISCALIA"
        required: false
      date:
        description: "Día puntual YYYY-MM-DD (opcional)"
        required: false
      backfill_from:
        description: "Backfill desde YYYY-MM-DD (opcional)"
        required: false
      backfill_to:
        description: "Backfill hasta YYYY-MM-DD (opcional)"
        required: false

concurrency:
  group: satisfaccion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Sincronizar satisfacción
        env:
          ZENDESK_SUBDOMAIN: ${{ secrets.ZENDESK_SUBDOMAIN }}
          ZENDESK_EMAIL: ${{ secrets.ZENDESK_EMAIL }}
          ZENDESK_API_TOKEN: ${{ secrets.ZENDESK_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IN_MARCA: ${{ github.event.inputs.marca }}
          IN_DATE: ${{ github.event.inputs.date }}
          IN_FROM: ${{ github.event.inputs.backfill_from }}
          IN_TO: ${{ github.event.inputs.backfill_to }}
        run: |
          ARGS=""
          [ -n "$IN_MARCA" ] && ARGS="$ARGS --marca $IN_MARCA"
          if [ -n "$IN_FROM" ]; then
            python scripts/sync_satisfaccion.py $ARGS --backfill "$IN_FROM" "${IN_TO:-$IN_FROM}"
          elif [ -n "$IN_DATE" ]; then
            python scripts/sync_satisfaccion.py $ARGS --date "$IN_DATE"
          else
            python scripts/sync_satisfaccion.py $ARGS --ultimos 10
          fi
